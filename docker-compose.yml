services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app.py:/app/app.py
      - ./grist_processor_working_all.py:/app/grist_processor_working_all.py
      - ./dn:/app/dn
      - ./common:/app/common
      - ./utils:/app/utils
      - ./grist:/app/grist
      - ./sync:/app/sync
      - ./configuration:/app/configuration
      - ./database:/app/database
      - ./templates:/app/templates
      - ./static:/app/static
      - ./build:/home/appuser/build:ro
    environment:
      - PATH=/app/.venv/bin:$PATH
      - DATABASE_URL=${DOCKER_DATABASE_URL}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
