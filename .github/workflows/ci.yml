name: CI
permissions:
    contents: read
on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
jobs:
    test-js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '24'
            - run: npm ci --ignore-scripts
            - run: npm test
            - run: cd front && npm ci --ignore-scripts
            - run: npm run test:vue
    test-python:
         runs-on: ubuntu-latest
         steps:
             - uses: actions/checkout@v4
             - uses: actions/setup-python@v4
               with:
                 python-version: '3.12'
             - run: pip install poetry
             - run: poetry install --with dev
             - run: poetry run poe test
    test-db:
         runs-on: ubuntu-latest
         env:
             # Ignore docker-compose.override.yml, qui exige un .env absent en CI
             COMPOSE_FILE: docker-compose.yml
             # Base jetable propre au job : ces valeurs ne sont pas des secrets,
             # et restent ainsi disponibles pour les PR Dependabot
             POSTGRES_DB: otp_ci
             POSTGRES_USER: otp
             POSTGRES_PASSWORD: otp
             DOCKER_DATABASE_URL: postgresql://otp:otp@localhost:5433/otp_ci
         steps:
             - uses: actions/checkout@v4
             - uses: actions/setup-python@v4
               with:
                 python-version: '3.12'
             - run: pip install poetry
             - run: poetry install --with dev
             - run: poetry run poe test-db
